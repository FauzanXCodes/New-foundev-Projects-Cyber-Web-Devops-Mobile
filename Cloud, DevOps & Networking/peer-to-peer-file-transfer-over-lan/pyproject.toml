[project]
name = "p2p-lan"
version = "0.1.0"
description = "Zero-config peer-to-peer file transfer over LAN"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Jakob Kuylenstierna", email = "jakob@example.com"}
]
keywords = ["p2p", "file-transfer", "lan", "networking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]

[project.optional-dependencies]
crypto = ["cryptography>=41.0"]
dev = ["pytest>=7.0", "pytest-mock>=3.0"]

[project.scripts]
p2p = "p2p_lan.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
